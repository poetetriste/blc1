[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bincompress-lab"
version = "0.1.0"
description = "Research codec for structure-aware lossless binary compression"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["iced-x86==1.22.0", "pyppmd==1.3.1"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Archiving :: Compression",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<0.15"]

[project.scripts]
bincompress = "bincompress.__main__:main"

[project.urls]
Homepage = "https://github.com/poetetriste/blc1"
Repository = "https://github.com/poetetriste/blc1"
Issues = "https://github.com/poetetriste/blc1/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra", "--tb=short"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "corpora", "vendor"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.setuptools.package-data]
bincompress = ["*.dll"]
