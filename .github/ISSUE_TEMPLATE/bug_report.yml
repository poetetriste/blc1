name: Bug report
description: Report an incorrect result, crash, or malformed archive handling issue
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not publish security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: revision
    attributes:
      label: BLC1 revision
      description: Commit hash or release version.
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options: [encode, decode, profile, package or install]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command and a shareable input or generator.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows version, Python version, architecture
    validations:
      required: true
